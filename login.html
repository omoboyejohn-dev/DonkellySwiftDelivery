<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Donkelly Swift Delivery</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="auth-page">

<header class="auth-header">

    <a href="index.html" class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>

        <div>

            <h2>
                Donkelly
                <span>Swift Delivery</span>
            </h2>

            <p>
                Send gifts 🎁, share love ❤️
            </p>

        </div>

    </a>

    <a href="index.html" class="back-home">

        <i class="fa-solid fa-arrow-left"></i>

        Back Home

    </a>

</header>


<main class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">

            <i class="fa-solid fa-right-to-bracket"></i>

        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">

            Login to your Donkelly Swift Delivery account
            to continue sending gifts.

        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Gmail
                </label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your Gmail address"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >

                        <i
                            class="fa-regular fa-eye"
                            id="passwordIcon"
                        ></i>

                    </button>

                </div>

            </div>


            <div class="login-options">

                <label>

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>

                <a href="forgot-password.html">
                    Forgot Password?
                </a>

            </div>


            <div
                class="form-message error-message"
                id="errorMessage"
            ></div>


            <div
                class="form-message success-message"
                id="successMessage"
            ></div>


            <button
                type="submit"
                class="auth-submit"
                id="loginButton"
            >

                <span id="loginButtonText">
                    Login Account
                </span>

                <i
                    class="fa-solid fa-arrow-right"
                    id="loginButtonIcon"
                ></i>

            </button>

        </form>


        <div class="auth-footer">

            <p>

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>

</main>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        signInWithEmailAndPassword,
        setPersistence,
        browserLocalPersistence,
        browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyAuD2HIYRG0ZHq7KtfSjzexhq6NkXii5Qo",

        authDomain:
            "donkellyswiftdelivery.firebaseapp.com",

        projectId:
            "donkellyswiftdelivery",

        storageBucket:
            "donkellyswiftdelivery.firebasestorage.app",

        messagingSenderId:
            "547113841009",

        appId:
            "1:547113841009:web:a4c054dca08fc1f5b4c6d0",

        measurementId:
            "G-HFG8ENEEVB"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    const ADMIN_EMAIL =
        "Danieloluwaseun221@gmail.com";


    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const rememberMe =
        document.getElementById("rememberMe");

    const passwordToggle =
        document.getElementById("passwordToggle");

    const passwordIcon =
        document.getElementById("passwordIcon");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");

    const loginButton =
        document.getElementById("loginButton");

    const loginButtonText =
        document.getElementById("loginButtonText");

    const loginButtonIcon =
        document.getElementById("loginButtonIcon");


    passwordToggle.addEventListener(
        "click",
        function() {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                passwordIcon.classList.remove(
                    "fa-eye"
                );

                passwordIcon.classList.add(
                    "fa-eye-slash"
                );

            } else {

                passwordInput.type = "password";

                passwordIcon.classList.remove(
                    "fa-eye-slash"
                );

                passwordIcon.classList.add(
                    "fa-eye"
                );

            }

        }
    );


    function showError(message) {

        errorMessage.textContent = message;

        errorMessage.style.display = "block";

        successMessage.style.display = "none";

    }


    function showSuccess(message) {

        successMessage.textContent = message;

        successMessage.style.display = "block";

        errorMessage.style.display = "none";

    }


    function clearMessages() {

        errorMessage.style.display = "none";

        successMessage.style.display = "none";

    }


    function setLoading(loading) {

        loginButton.disabled = loading;

        if (loading) {

            loginButtonText.textContent =
                "Logging in...";

            loginButtonIcon.className =
                "fa-solid fa-spinner fa-spin";

        } else {

            loginButtonText.textContent =
                "Login Account";

            loginButtonIcon.className =
                "fa-solid fa-arrow-right";

        }

    }


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            clearMessages();

            const email =
                emailInput.value
                .trim()
                .toLowerCase();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showError(
                    "Please enter your Gmail and password."
                );

                return;

            }


            if (!email.includes("@")) {

                showError(
                    "Please enter a valid Gmail address."
                );

                return;

            }


            try {

                setLoading(true);


                if (rememberMe.checked) {

                    await setPersistence(
                        auth,
                        browserLocalPersistence
                    );

                } else {

                    await setPersistence(
                        auth,
                        browserSessionPersistence
                    );

                }


                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                showSuccess(
                    "Login successful. Redirecting..."
                );


                setTimeout(
                    function() {

                        /*
                         * IMPORTANT:
                         * admin-deposits.html is in the
                         * root of the GitHub repository.
                         */

                        if (
                            user.email &&
                            user.email.toLowerCase() ===
                            ADMIN_EMAIL.toLowerCase()
                        ) {

                            window.location.href =
                                "admin-deposits.html";

                        } else {

                            window.location.href =
                                "dashboard.html";

                        }

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                setLoading(false);


                let message =
                    "Unable to login. Please try again.";


                switch (error.code) {

                    case "auth/invalid-credential":

                        message =
                            "Incorrect Gmail or password.";

                        break;


                    case "auth/user-not-found":

                        message =
                            "No account was found with this Gmail.";

                        break;


                    case "auth/wrong-password":

                        message =
                            "Incorrect password.";

                        break;


                    case "auth/invalid-email":

                        message =
                            "Please enter a valid Gmail address.";

                        break;


                    case "auth/user-disabled":

                        message =
                            "This account has been disabled.";

                        break;


                    case "auth/too-many-requests":

                        message =
                            "Too many login attempts. Please try again later.";

                        break;


                    case "auth/network-request-failed":

                        message =
                            "Network error. Please check your internet connection.";

                        break;

                }


                showError(message);

            }

        }
    );

</script>

</body>

</html>
