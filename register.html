<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Donkelly Swift Delivery</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body class="auth-page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="auth-header">

    <a href="index.html" class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-bag-shopping"></i>
        </div>

        <div>

            <h2>
                Donkelly
                <span>Swift Delivery</span>
            </h2>

            <p>
                Send gifts 🎁, share love ❤️
            </p>

        </div>

    </a>


    <a href="index.html" class="back-home">

        <i class="fa-solid fa-arrow-left"></i>

        Back Home

    </a>

</header>



<!-- =====================================================
     REGISTER
===================================================== -->

<main class="auth-container">

    <div class="auth-card">


        <div class="auth-icon">

            <i class="fa-solid fa-user-plus"></i>

        </div>


        <h1>
            Create Account
        </h1>


        <p class="auth-subtitle">

            Create your Donkelly Swift Delivery account
            and start sending gifts to people you love.

        </p>



        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>


                <div class="input-box">

                    <i class="fa-regular fa-user"></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Gmail
                </label>


                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your Gmail address"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>


                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >

                </div>

            </div>



            <!-- COUNTRY -->

            <div class="form-group">

                <label for="country">
                    Country
                </label>


                <div class="input-box">

                    <i class="fa-solid fa-globe"></i>

                    <select id="country" required>

                        <option value="">
                            Select your country
                        </option>

                        <option value="Nigeria">
                            Nigeria
                        </option>

                        <option value="United States">
                            United States
                        </option>

                        <option value="United Kingdom">
                            United Kingdom
                        </option>

                        <option value="Canada">
                            Canada
                        </option>

                        <option value="Australia">
                            Australia
                        </option>

                        <option value="Ghana">
                            Ghana
                        </option>

                        <option value="South Africa">
                            South Africa
                        </option>

                        <option value="Kenya">
                            Kenya
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>


                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >

                        <i
                            class="fa-regular fa-eye"
                            id="passwordIcon"
                        ></i>

                    </button>

                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="confirmPasswordToggle"
                    >

                        <i
                            class="fa-regular fa-eye"
                            id="confirmPasswordIcon"
                        ></i>

                    </button>

                </div>

            </div>



            <!-- TERMS -->

            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>

                        I agree to the
                        <a href="terms.html">
                            Terms & Conditions
                        </a>
                        and
                        <a href="privacy.html">
                            Privacy Policy
                        </a>.

                    </span>

                </label>

            </div>



            <!-- ERROR -->

            <div
                class="form-message error-message"
                id="errorMessage"
            ></div>



            <!-- SUCCESS -->

            <div
                class="form-message success-message"
                id="successMessage"
            ></div>



            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="auth-submit"
                id="registerButton"
            >

                <span id="registerButtonText">
                    Create Account
                </span>

                <i
                    class="fa-solid fa-arrow-right"
                    id="registerButtonIcon"
                ></i>

            </button>


        </form>



        <!-- LOGIN -->

        <div class="auth-footer">

            <p>

                Already have an account?

                <a href="login.html">
                    Login Account
                </a>

            </p>

        </div>


    </div>

</main>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyAuD2HIYRG0ZHq7KtfSjzexhq6NkXii5Qo",

        authDomain:
            "donkellyswiftdelivery.firebaseapp.com",

        projectId:
            "donkellyswiftdelivery",

        storageBucket:
            "donkellyswiftdelivery.firebasestorage.app",

        messagingSenderId:
            "547113841009",

        appId:
            "1:547113841009:web:a4c054dca08fc1f5b4c6d0",

        measurementId:
            "G-HFG8ENEEVB"

    };



    // =====================================================
    // INITIALIZE FIREBASE
    // =====================================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);



    // =====================================================
    // ELEMENTS
    // =====================================================

    const registerForm =
        document.getElementById("registerForm");

    const fullName =
        document.getElementById("fullName");

    const email =
        document.getElementById("email");

    const phone =
        document.getElementById("phone");

    const country =
        document.getElementById("country");

    const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const terms =
        document.getElementById("terms");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");

    const registerButton =
        document.getElementById("registerButton");

    const registerButtonText =
        document.getElementById("registerButtonText");

    const registerButtonIcon =
        document.getElementById("registerButtonIcon");



    // =====================================================
    // PASSWORD TOGGLE FUNCTION
    // =====================================================

    function createPasswordToggle(
        button,
        input,
        icon
    ) {

        button.addEventListener(
            "click",
            function() {

                if (
                    input.type ===
                    "password"
                ) {

                    input.type =
                        "text";

                    icon.classList.remove(
                        "fa-eye"
                    );

                    icon.classList.add(
                        "fa-eye-slash"
                    );

                } else {

                    input.type =
                        "password";

                    icon.classList.remove(
                        "fa-eye-slash"
                    );

                    icon.classList.add(
                        "fa-eye"
                    );

                }

            }
        );

    }



    createPasswordToggle(

        document.getElementById(
            "passwordToggle"
        ),

        password,

        document.getElementById(
            "passwordIcon"
        )

    );


    createPasswordToggle(

        document.getElementById(
            "confirmPasswordToggle"
        ),

        confirmPassword,

        document.getElementById(
            "confirmPasswordIcon"
        )

    );



    // =====================================================
    // MESSAGES
    // =====================================================

    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.style.display =
            "block";

        successMessage.style.display =
            "none";

    }


    function showSuccess(message) {

        successMessage.textContent =
            message;

        successMessage.style.display =
            "block";

        errorMessage.style.display =
            "none";

    }


    function clearMessages() {

        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";

    }



    // =====================================================
    // BUTTON LOADING
    // =====================================================

    function setLoading(loading) {

        registerButton.disabled =
            loading;


        if (loading) {

            registerButtonText.textContent =
                "Creating Account...";

            registerButtonIcon.className =
                "fa-solid fa-spinner fa-spin";

        } else {

            registerButtonText.textContent =
                "Create Account";

            registerButtonIcon.className =
                "fa-solid fa-arrow-right";

        }

    }



    // =====================================================
    // REGISTER
    // =====================================================

    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            clearMessages();


            const nameValue =
                fullName.value.trim();


            const emailValue =
                email.value.trim().toLowerCase();


            const phoneValue =
                phone.value.trim();


            const countryValue =
                country.value;


            const passwordValue =
                password.value;


            const confirmPasswordValue =
                confirmPassword.value;



            // =================================================
            // VALIDATION
            // =================================================

            if (!nameValue) {

                showError(
                    "Please enter your full name."
                );

                return;

            }


            if (nameValue.length < 2) {

                showError(
                    "Please enter a valid full name."
                );

                return;

            }


            if (!emailValue) {

                showError(
                    "Please enter your Gmail address."
                );

                return;

            }


            if (!phoneValue) {

                showError(
                    "Please enter your phone number."
                );

                return;

            }


            if (!countryValue) {

                showError(
                    "Please select your country."
                );

                return;

            }


            if (passwordValue.length < 6) {

                showError(
                    "Password must contain at least 6 characters."
                );

                return;

            }


            if (
                passwordValue !==
                confirmPasswordValue
            ) {

                showError(
                    "Passwords do not match."
                );

                return;

            }


            if (!terms.checked) {

                showError(
                    "Please agree to the Terms & Conditions and Privacy Policy."
                );

                return;

            }



            // =================================================
            // CREATE ACCOUNT
            // =================================================

            try {

                setLoading(true);


                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        emailValue,
                        passwordValue
                    );


                const user =
                    userCredential.user;



                // =================================================
                // UPDATE FIREBASE AUTH PROFILE
                // =================================================

                await updateProfile(
                    user,
                    {
                        displayName:
                            nameValue
                    }
                );



                // =================================================
                // SAVE USER TO FIRESTORE
                // =================================================

                await setDoc(

                    doc(
                        db,
                        "users",
                        user.uid
                    ),

                    {

                        uid:
                            user.uid,

                        fullName:
                            nameValue,

                        email:
                            emailValue,

                        phone:
                            phoneValue,

                        country:
                            countryValue,

                        walletBalance:
                            0,

                        totalDeposits:
                            0,

                        totalOrders:
                            0,

                        createdAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp(),

                        accountStatus:
                            "active"

                    }

                );



                // =================================================
                // SUCCESS
                // =================================================

                showSuccess(
                    "Account created successfully. Redirecting..."
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                setLoading(false);


                let message =
                    "Unable to create your account. Please try again.";


                switch (error.code) {

                    case "auth/email-already-in-use":

                        message =
                            "An account already exists with this Gmail.";

                        break;


                    case "auth/invalid-email":

                        message =
                            "Please enter a valid Gmail address.";

                        break;


                    case "auth/weak-password":

                        message =
                            "Your password is too weak. Use at least 6 characters.";

                        break;


                    case "auth/network-request-failed":

                        message =
                            "Network error. Please check your internet connection.";

                        break;


                    case "auth/operation-not-allowed":

                        message =
                            "Email/password registration is not enabled in Firebase.";

                        break;

                }


                showError(message);

            }

        }
    );

</script>


</body>

</html>
