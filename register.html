<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Donkelly Swift Delivery</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body class="auth-page">


    <!-- ================= HEADER ================= -->

    <header class="auth-header">

        <a href="index.html" class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-bag-shopping"></i>
            </div>

            <div>

                <h2>
                    Donkelly
                    <span>Swift Delivery</span>
                </h2>

                <p>
                    Send gifts 🎁, share love ❤️
                </p>

            </div>

        </a>


        <a href="index.html" class="back-home">

            <i class="fa-solid fa-arrow-left"></i>

            Back Home

        </a>

    </header>



    <!-- ================= REGISTER ================= -->

    <main class="auth-container">

        <div class="auth-card">


            <!-- ICON -->

            <div class="auth-icon">

                <i class="fa-solid fa-user-plus"></i>

            </div>


            <!-- TITLE -->

            <h1>
                Create Account
            </h1>


            <p class="auth-subtitle">

                Create your Donkelly Swift Delivery account
                and start sending gifts to your loved ones.

            </p>



            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>



                <!-- GMAIL -->

                <div class="form-group">

                    <label for="email">
                        Gmail
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your Gmail address"
                            required
                        >

                    </div>

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Number
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('password', this)"
                        >

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword', this)"
                        >

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>

                            I agree to the

                            <a href="#">
                                Terms & Conditions
                            </a>

                            and

                            <a href="#">
                                Privacy Policy
                            </a>.

                        </span>

                    </label>

                </div>



                <!-- ERROR -->

                <div
                    class="form-message error-message"
                    id="errorMessage"
                ></div>



                <!-- SUCCESS -->

                <div
                    class="form-message success-message"
                    id="successMessage"
                ></div>



                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    class="auth-submit"
                    id="registerButton"
                >

                    <span id="buttonText">
                        Create Account
                    </span>

                    <i
                        class="fa-solid fa-arrow-right"
                        id="buttonIcon"
                    ></i>

                </button>


            </form>



            <!-- LOGIN -->

            <div class="auth-footer">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Login Account
                    </a>

                </p>

            </div>


        </div>

    </main>



    <!-- ================= FIREBASE ================= -->

    <script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    // ================================
    // FIREBASE CONFIG
    // ================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyAuD2HIYRG0ZHq7KtfSjzexhq6NkXii5Qo",

        authDomain:
            "donkellyswiftdelivery.firebaseapp.com",

        projectId:
            "donkellyswiftdelivery",

        storageBucket:
            "donkellyswiftdelivery.firebasestorage.app",

        messagingSenderId:
            "547113841009",

        appId:
            "1:547113841009:web:a4c054dca08fc1f5b4c6d0",

        measurementId:
            "G-HFG8ENEEVB"
    };


    // ================================
    // INITIALIZE FIREBASE
    // ================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    // ================================
    // PASSWORD TOGGLE
    // ================================

    window.togglePassword = function(inputId, button) {

        const input =
            document.getElementById(inputId);

        const icon =
            button.querySelector("i");


        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    };


    // ================================
    // REGISTER FORM
    // ================================

    const registerForm =
        document.getElementById("registerForm");


    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            // Get values

            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const phone =
                document
                    .getElementById("phone")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;

            const terms =
                document
                    .getElementById("terms")
                    .checked;


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );

            const successMessage =
                document.getElementById(
                    "successMessage"
                );


            // Reset messages

            errorMessage.style.display = "none";

            successMessage.style.display = "none";


            // ================================
            // VALIDATION
            // ================================

            if (password.length < 8) {

                errorMessage.textContent =
                    "Password must contain at least 8 characters.";

                errorMessage.style.display =
                    "block";

                return;
            }


            if (password !== confirmPassword) {

                errorMessage.textContent =
                    "Passwords do not match.";

                errorMessage.style.display =
                    "block";

                return;
            }


            if (!terms) {

                errorMessage.textContent =
                    "Please agree to the Terms & Conditions.";

                errorMessage.style.display =
                    "block";

                return;
            }


            // ================================
            // DISABLE BUTTON
            // ================================

            const submitButton =
                registerForm.querySelector(
                    ".auth-submit"
                );


            submitButton.disabled = true;

            submitButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';


            try {

                // ================================
                // CREATE FIREBASE AUTH ACCOUNT
                // ================================

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                // ================================
                // SAVE CUSTOMER TO FIRESTORE
                // ================================

                await setDoc(
                    doc(db, "users", user.uid),
                    {

                        uid: user.uid,

                        fullName: fullName,

                        email: email,

                        phone: phone,

                        walletBalance: 0,

                        role: "customer",

                        createdAt:
                            serverTimestamp()

                    }
                );


                // ================================
                // SUCCESS
                // ================================

                successMessage.textContent =
                    "Account created successfully. Redirecting...";

                successMessage.style.display =
                    "block";


                // ================================
                // GO TO DASHBOARD
                // ================================

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                // ================================
                // FIREBASE ERRORS
                // ================================

                let message =
                    "Unable to create your account. Please try again.";


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    message =
                        "This Gmail is already registered. Please login instead.";

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    message =
                        "Please enter a valid Gmail address.";

                }

                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    message =
                        "Your password is too weak. Use at least 8 characters.";

                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    message =
                        "Network error. Please check your internet connection.";

                }


                errorMessage.textContent =
                    message;

                errorMessage.style.display =
                    "block";


                // Enable button again

                submitButton.disabled = false;

                submitButton.innerHTML =
                    'Create Account <i class="fa-solid fa-arrow-right"></i>';

            }

        }
    );

    </script>

</body>

</html>
