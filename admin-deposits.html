<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Deposits | Donkelly Swift Delivery</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f5faf7;
        }

        .admin-page {
            width: 92%;
            max-width: 1250px;
            margin: auto;
            padding: 35px 0 70px;
        }

        .admin-header {
            background: #ffffff;
            border: 1px solid #e5ebe7;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .admin-header h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .admin-header p {
            color: #66716b;
            font-size: 13px;
        }

        .admin-badge {
            background: #eaf8ef;
            color: #079447;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        .deposit-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e5ebe7;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-card i {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #eaf8ef;
            color: #079447;
            margin-bottom: 12px;
        }

        .stat-card h3 {
            font-size: 24px;
        }

        .stat-card p {
            color: #66716b;
            font-size: 12px;
        }

        .deposits-card {
            background: #ffffff;
            border: 1px solid #e5ebe7;
            border-radius: 16px;
            overflow: hidden;
        }

        .deposits-title {
            padding: 22px;
            border-bottom: 1px solid #e5ebe7;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .deposits-title h2 {
            font-size: 18px;
        }

        .refresh-button {
            border: 1px solid #079447;
            background: #ffffff;
            color: #079447;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            font-size: 12px;
        }

        .refresh-button:hover {
            background: #079447;
            color: #ffffff;
        }

        .deposit-list {
            padding: 20px;
        }

        .deposit-item {
            border: 1px solid #e5ebe7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .deposit-item:last-child {
            margin-bottom: 0;
        }

        .deposit-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .customer-info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .customer-info p {
            color: #66716b;
            font-size: 11px;
        }

        .pending-badge {
            background: #fff7e6;
            color: #b76e00;
            border: 1px solid #ffe0a3;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
        }

        .deposit-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }

        .detail-box {
            background: #f7faf8;
            border-radius: 8px;
            padding: 12px;
        }

        .detail-box small {
            display: block;
            color: #66716b;
            font-size: 10px;
            margin-bottom: 3px;
        }

        .detail-box strong {
            font-size: 12px;
            word-break: break-word;
        }

        .deposit-actions {
            display: flex;
            gap: 10px;
        }

        .approve-button,
        .reject-button {
            border: none;
            padding: 11px 17px;
            border-radius: 7px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .approve-button {
            background: #079447;
            color: #ffffff;
        }

        .approve-button:hover {
            background: #056b34;
        }

        .reject-button {
            background: #fff1f1;
            color: #d93025;
            border: 1px solid #f0d0d0;
        }

        .reject-button:hover {
            background: #d93025;
            color: #ffffff;
        }

        .loading,
        .empty-message,
        .error-message {
            padding: 40px 20px;
            text-align: center;
            color: #66716b;
            font-size: 13px;
        }

        .loading i {
            color: #079447;
            margin-right: 7px;
        }

        .empty-message i {
            display: block;
            font-size: 35px;
            color: #079447;
            margin-bottom: 10px;
        }

        .admin-footer {
            margin-top: 25px;
            text-align: center;
            color: #66716b;
            font-size: 11px;
        }

        @media (max-width: 700px) {

            .admin-page {
                width: 94%;
                padding-top: 20px;
            }

            .admin-header {
                padding: 18px;
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-header h1 {
                font-size: 22px;
            }

            .deposit-stats {
                grid-template-columns: 1fr;
            }

            .deposit-details {
                grid-template-columns: 1fr;
            }

            .deposit-top {
                flex-direction: column;
            }

            .deposit-actions {
                flex-direction: column;
            }

            .approve-button,
            .reject-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<main class="admin-page">


    <!-- ================================
         ADMIN HEADER
    ================================= -->

    <section class="admin-header">

        <div>

            <h1>
                Deposit Management
            </h1>

            <p>
                Review customer deposit payment requests.
            </p>

        </div>

        <div class="admin-badge">

            <i class="fa-solid fa-user-shield"></i>

            Admin

        </div>

    </section>



    <!-- ================================
         STATISTICS
    ================================= -->

    <section class="deposit-stats">

        <div class="stat-card">

            <i class="fa-solid fa-clock"></i>

            <h3 id="pendingCount">
                0
            </h3>

            <p>
                Pending Deposits
            </p>

        </div>


        <div class="stat-card">

            <i class="fa-solid fa-check-circle"></i>

            <h3 id="approvedCount">
                0
            </h3>

            <p>
                Approved Deposits
            </p>

        </div>


        <div class="stat-card">

            <i class="fa-solid fa-naira-sign"></i>

            <h3 id="totalAmount">
                ₦0.00
            </h3>

            <p>
                Pending Amount
            </p>

        </div>

    </section>



    <!-- ================================
         DEPOSITS
    ================================= -->

    <section class="deposits-card">

        <div class="deposits-title">

            <h2>
                Customer Deposit Requests
            </h2>

            <button
                class="refresh-button"
                id="refreshButton">

                <i class="fa-solid fa-rotate"></i>

                Refresh

            </button>

        </div>


        <div
            class="deposit-list"
            id="depositList">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                Loading deposits...

            </div>

        </div>

    </section>


    <div class="admin-footer">

        Donkelly Swift Delivery Admin Panel

    </div>


</main>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        getDoc,
        updateDoc,
        increment,
        query,
        orderBy
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";



    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyAuD2HIYRG0ZHq7KtfSjzexhq6NkXii5Qo",

        authDomain:
            "donkellyswiftdelivery.firebaseapp.com",

        projectId:
            "donkellyswiftdelivery",

        storageBucket:
            "donkellyswiftdelivery.firebasestorage.app",

        messagingSenderId:
            "547113841009",

        appId:
            "1:547113841009:web:a4c054dca08fc1f5b4c6d0",

        measurementId:
            "G-HFG8ENEEVB"

    };



    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);



    // ==========================================
    // ADMIN EMAIL
    // ==========================================

    const ADMIN_EMAIL =
        "Danieloluwaseun221@gmail.com";



    // ==========================================
    // ELEMENTS
    // ==========================================

    const depositList =
        document.getElementById("depositList");

    const pendingCount =
        document.getElementById("pendingCount");

    const approvedCount =
        document.getElementById("approvedCount");

    const totalAmount =
        document.getElementById("totalAmount");



    // ==========================================
    // FORMAT NAIRA
    // ==========================================

    function formatNaira(amount) {

        return "₦" +
            Number(amount || 0).toLocaleString(
                "en-NG",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

    }



    // ==========================================
    // DATE FORMAT
    // ==========================================

    function formatDate(timestamp) {

        if (!timestamp) {
            return "Date unavailable";
        }

        try {

            const date =
                timestamp.toDate();

            return date.toLocaleString(
                "en-NG",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        } catch {

            return "Date unavailable";

        }

    }



    // ==========================================
    // CHECK ADMIN
    // ==========================================

    onAuthStateChanged(
        auth,
        async function(user) {

            if (!user) {

                window.location.href =
                    "login.html";

                return;

            }


            if (
                user.email.toLowerCase() !==
                ADMIN_EMAIL.toLowerCase()
            ) {

                alert(
                    "Access denied. Admin account required."
                );

                window.location.href =
                    "dashboard.html";

                return;

            }


            loadDeposits();

        }
    );



    // ==========================================
    // LOAD DEPOSITS
    // ==========================================

    async function loadDeposits() {

        depositList.innerHTML = `

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                Loading deposits...

            </div>

        `;


        try {

            const depositsRef =
                collection(
                    db,
                    "deposits"
                );


            let snapshot;


            try {

                const depositsQuery =
                    query(
                        depositsRef,
                        orderBy(
                            "createdAt",
                            "desc"
                        )
                    );

                snapshot =
                    await getDocs(
                        depositsQuery
                    );

            } catch {

                snapshot =
                    await getDocs(
                        depositsRef
                    );

            }


            depositList.innerHTML = "";


            let pending = 0;
            let approved = 0;
            let pendingAmount = 0;


            if (snapshot.empty) {

                depositList.innerHTML = `

                    <div class="empty-message">

                        <i class="fa-solid fa-inbox"></i>

                        No deposit requests yet.

                    </div>

                `;

                updateStats(
                    0,
                    0,
                    0
                );

                return;

            }


            snapshot.forEach(
                function(depositDoc) {

                    const data =
                        depositDoc.data();


                    const depositId =
                        depositDoc.id;


                    const status =
                        data.status ||
                        "pending";


                    const amount =
                        Number(
                            data.amount ||
                            data.depositAmount ||
                            0
                        );


                    if (
                        status === "pending" ||
                        status === "processing"
                    ) {

                        pending++;

                        pendingAmount += amount;

                    }


                    if (
                        status === "approved"
                    ) {

                        approved++;

                    }


                    const customerName =
                        data.fullName ||
                        data.customerName ||
                        "Customer";


                    const customerEmail =
                        data.email ||
                        data.customerEmail ||
                        "No email";


                    const senderName =
                        data.senderName ||
                        "Not provided";


                    const reference =
                        data.transactionReference ||
                        data.reference ||
                        "Not provided";


                    const createdAt =
                        formatDate(
                            data.createdAt
                        );


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "deposit-item";


                    item.innerHTML = `

                        <div class="deposit-top">

                            <div class="customer-info">

                                <h3>
                                    ${escapeHtml(customerName)}
                                </h3>

                                <p>
                                    ${escapeHtml(customerEmail)}
                                </p>

                            </div>

                            <span class="pending-badge">

                                ${escapeHtml(
                                    status.toUpperCase()
                                )}

                            </span>

                        </div>


                        <div class="deposit-details">


                            <div class="detail-box">

                                <small>
                                    Deposit Amount
                                </small>

                                <strong>
                                    ${formatNaira(amount)}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Sender Name
                                </small>

                                <strong>
                                    ${escapeHtml(senderName)}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Transaction Reference
                                </small>

                                <strong>
                                    ${escapeHtml(reference)}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Submitted
                                </small>

                                <strong>
                                    ${createdAt}
                                </strong>

                            </div>


                            <div class="detail-box">

                                <small>
                                    Deposit ID
                                </small>

                                <strong>
                                    ${escapeHtml(depositId)}
                                </strong>

                            </div>


                        </div>


                        ${
                            status === "pending" ||
                            status === "processing"

                            ?

                            `

                            <div class="deposit-actions">

                                <button
                                    class="approve-button"
                                    data-id="${depositId}"
                                    data-uid="${data.userId || data.uid || ""}"
                                    data-amount="${amount}">

                                    <i class="fa-solid fa-check"></i>

                                    Approve Payment

                                </button>


                                <button
                                    class="reject-button"
                                    data-id="${depositId}">

                                    <i class="fa-solid fa-xmark"></i>

                                    Reject

                                </button>

                            </div>

                            `

                            :

                            ""

                        }

                    `;


                    depositList.appendChild(
                        item
                    );

                }
            );


            updateStats(
                pending,
                approved,
                pendingAmount
            );


            attachDepositActions();

        } catch (error) {

            console.error(
                "Load deposits error:",
                error
            );


            depositList.innerHTML = `

                <div class="error-message">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    Unable to load deposits.

                    <br><br>

                    ${escapeHtml(error.message)}

                </div>

            `;

        }

    }



    // ==========================================
    // UPDATE STATS
    // ==========================================

    function updateStats(
        pending,
        approved,
        amount
    ) {

        pendingCount.textContent =
            pending;

        approvedCount.textContent =
            approved;

        totalAmount.textContent =
            formatNaira(amount);

    }



    // ==========================================
    // ATTACH BUTTON ACTIONS
    // ==========================================

    function attachDepositActions() {

        document
            .querySelectorAll(
                ".approve-button"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            approveDeposit(
                                button.dataset.id,
                                button.dataset.uid,
                                button.dataset.amount
                            );

                        }
                    );

                }
            );


        document
            .querySelectorAll(
                ".reject-button"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            rejectDeposit(
                                button.dataset.id
                            );

                        }
                    );

                }
            );

    }



    // ==========================================
    // APPROVE DEPOSIT
    // ==========================================

    async function approveDeposit(
        depositId,
        userId,
        amount
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to approve this payment?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const depositRef =
                doc(
                    db,
                    "deposits",
                    depositId
                );


            const depositSnapshot =
                await getDoc(
                    depositRef
                );


            if (
                !depositSnapshot.exists()
            ) {

                alert(
                    "Deposit request no longer exists."
                );

                return;

            }


            const depositData =
                depositSnapshot.data();


            if (
                depositData.status ===
                "approved"
            ) {

                alert(
                    "This deposit has already been approved."
                );

                return;

            }


            // Update deposit status

            await updateDoc(
                depositRef,
                {

                    status:
                        "approved",

                    approvedBy:
                        ADMIN_EMAIL,

                    approvedAt:
                        new Date()

                }
            );


            // Add money to customer wallet

            if (userId) {

                const userRef =
                    doc(
                        db,
                        "users",
                        userId
                    );


                await updateDoc(
                    userRef,
                    {

                        walletBalance:
                            increment(
                                Number(amount || 0)
                            )

                    }
                );

            }


            alert(
                "Deposit approved successfully."
            );


            loadDeposits();

        } catch (error) {

            console.error(
                "Approve error:",
                error
            );

            alert(
                "Unable to approve deposit: " +
                error.message
            );

        }

    }



    // ==========================================
    // REJECT DEPOSIT
    // ==========================================

    async function rejectDeposit(
        depositId
    ) {

        const confirmed =
            confirm(
                "Are you sure you want to reject this payment?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const depositRef =
                doc(
                    db,
                    "deposits",
                    depositId
                );


            await updateDoc(
                depositRef,
                {

                    status:
                        "rejected",

                    rejectedBy:
                        ADMIN_EMAIL,

                    rejectedAt:
                        new Date()

                }
            );


            alert(
                "Deposit rejected."
            );


            loadDeposits();

        } catch (error) {

            console.error(
                "Reject error:",
                error
            );

            alert(
                "Unable to reject deposit: " +
                error.message
            );

        }

    }



    // ==========================================
    // REFRESH
    // ==========================================

    document
        .getElementById(
            "refreshButton"
        )
        .addEventListener(
            "click",
            loadDeposits
        );



    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>


</body>

</html>
